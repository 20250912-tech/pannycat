<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 지금 드는 느낌</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding onboarding--step onboarding--feeling" data-node-id="1:2429">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <div class="progress" role="progressbar" aria-label="온보딩 진행도" aria-valuemin="1" aria-valuemax="6" aria-valuenow="5">
      <span class="progress__fill" style="--progress: 5 / 6"></span>
    </div>

    <h1 class="step__title">지금 어떤 느낌이 가장 크게 드나요?</h1>
    <p class="step__subtitle" id="feeling-hint">가장 가까운 느낌 하나를 골라주세요.</p>

    <div class="spacer spacer--before-chips"></div>

    <!-- data-select="single": 하나만 선택 -->
    <div class="chips" role="group" aria-labelledby="feeling-hint" data-select="single">
      <button type="button" class="chip" aria-pressed="false" data-value="racing-heart">몸이 두근거리거나 긴장돼요</button>
      <button type="button" class="chip" aria-pressed="false" data-value="worry">걱정과 생각이 많아져요</button>
      <button type="button" class="chip" aria-pressed="false" data-value="unfocused">주변에 집중하기 어려워요</button>
      <button type="button" class="chip" aria-pressed="false" data-value="escape">지금 있는 상황을 벗어나고 싶어요</button>
      <button type="button" class="chip" aria-pressed="false" data-value="calm">지금은 비교적 편안해요</button>
      <button type="button" class="chip" id="custom-open" aria-expanded="false" aria-controls="custom-form">직접 작성하기</button>
      <form class="chip-input" id="custom-form" hidden>
        <label class="visually-hidden" for="custom-text">지금 드는 느낌 직접 작성</label>
        <input id="custom-text" type="text" maxlength="24" autocomplete="off" enterkeyhint="done" placeholder="직접 입력해 주세요" />
        <button type="submit" class="chip-input__submit">추가</button>
      </form>
    </div>

    <div class="spacer spacer--after-chips"></div>

    <a class="skip-link" href="onboarding-ready.html">건너뛰기</a>

    <div class="btn-row">
      <a class="btn-secondary" href="onboarding-anxiety.html">이전으로</a>
      <a class="btn-primary" href="onboarding-ready.html">다음으로</a>
    </div>
  </main>

  <script src="onboarding-chips.js"></script>
</body>
</html>
