<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 불안을 느끼는 순간</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding onboarding--step onboarding--trigger" data-node-id="1:2460">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <div class="progress" role="progressbar" aria-label="온보딩 진행도" aria-valuemin="1" aria-valuemax="6" aria-valuenow="2">
      <span class="progress__fill" style="--progress: 2 / 6"></span>
    </div>

    <h1 class="step__title">어떤 순간에 불안을 가장 크게 느끼나요?</h1>
    <p class="step__subtitle" id="trigger-hint">평소 경험을 떠올려 골라주세요. 여러 개를 선택해도 괜찮아요.</p>

    <div class="spacer spacer--before-chips"></div>

    <div class="chips" role="group" aria-labelledby="trigger-hint">
      <button type="button" class="chip" aria-pressed="false" data-value="crowded">사람이 많거나 붐비는 곳에 있을 때</button>
      <button type="button" class="chip" aria-pressed="false" data-value="anticipatory">불안이 다시 올까 걱정될 때</button>
      <button type="button" class="chip" aria-pressed="false" data-value="body-change">몸의 변화가 느껴질 때</button>
      <button type="button" class="chip" aria-pressed="false" data-value="big-event">중요한 일을 앞두고 있을 때</button>
      <button type="button" class="chip" aria-pressed="false" data-value="hard-to-escape">벗어나기 어려운 상황·공간</button>
      <button type="button" class="chip" aria-pressed="false" data-value="alone">혼자 있고 도움받기 어렵다고 느낄 때</button>
      <button type="button" class="chip" id="custom-open" aria-expanded="false" aria-controls="custom-form">직접 작성하기</button>
      <form class="chip-input" id="custom-form" hidden>
        <label class="visually-hidden" for="custom-text">불안을 느끼는 순간 직접 작성</label>
        <input id="custom-text" type="text" maxlength="24" autocomplete="off" enterkeyhint="done" placeholder="직접 입력해 주세요" />
        <button type="submit" class="chip-input__submit">추가</button>
      </form>
    </div>

    <div class="spacer spacer--after-chips"></div>

    <a class="skip-link" href="onboarding-ready.html">건너뛰기</a>

    <div class="btn-row">
      <a class="btn-secondary" href="onboarding-help.html">이전으로</a>
      <a class="btn-primary" href="onboarding-coping.html">다음으로</a>
    </div>
  </main>

  <script src="onboarding-chips.js"></script>
</body>
</html>
