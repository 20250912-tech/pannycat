<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 마음일기 기록하기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-back-origin="apply">
  <!-- Figma 1992:12378 "감정 상태" (활동하기 → 마음일기 첫 화면) — .onboarding.breath 프레임 · .appbar · .saved__toast 재사용 -->
  <main class="onboarding breath diary diary-write" data-node-id="1992:12378">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <header class="appbar" data-node-id="24:7238">
      <a class="appbar__back" href="activity.html" id="back" aria-label="뒤로 가기">
        <img src="assets/diary/back.svg" width="24" height="24" alt="" />
      </a>
      <h1 class="appbar__title diary__title">마음일기</h1>
      <span class="appbar__side" aria-hidden="true"><img src="assets/home/info.svg" width="24" height="24" alt="" /></span>
    </header>

    <form class="diary-write__form" id="diary-form" novalidate>
      <!-- 포스트잇 (24:7250) — 구석 접힌 색상은 선택한 감정(--emo) -->
      <div class="postit-wrap diary-write__note" id="note" data-node-id="24:7250">
        <div class="postit">
          <p class="postit__head">
            <time class="postit__date" id="note-date"></time>
            <span class="postit__time" id="note-time"></span>
          </p>
          <label class="visually-hidden" for="diary-text">오늘의 마음 일기</label>
          <textarea class="postit__input" id="diary-text" maxlength="500"
            placeholder="오늘의 마음 일기를&#10;간단하게 기록해 보세요!"></textarea>
          <svg class="postit__fold" viewBox="0 0 66 65" aria-hidden="true"><path d="M0 64.8373V26.0366C0.000249053 11.6571 11.6571 0.000259417 26.0366 0H66L0 64.8373Z" /></svg>
        </div>
      </div>

      <!-- 감정 상태 (24:7272) -->
      <fieldset class="emo-card" data-node-id="24:7272">
        <legend class="emo-card__title">감정 상태</legend>
        <div class="emo-card__list" id="emo-list"></div>
      </fieldset>

      <!-- 취소 · 저장 (24:7243) -->
      <div class="diary-write__actions" data-node-id="24:7243">
        <a class="round-btn round-btn--close" href="diary.html" id="cancel" aria-label="취소하고 마음일기 모아보기로 이동" data-node-id="1992:12386">
          <img src="assets/diary/btn-close-x.svg" width="21.984" height="21.984" alt="" />
        </a>
        <button type="submit" class="round-btn round-btn--check" aria-label="저장하기" data-node-id="1992:12390">
          <img src="assets/diary/btn-check.svg" width="64.3636" height="64.3636" alt="" />
        </button>
      </div>
    </form>

    <p class="saved__toast" id="toast" role="status" aria-live="polite" hidden></p>

    <!-- 저장 완료 (Figma 2011:20057) — 파일 가운데 발바닥이 통통 튀며 작게 터짐, 체크 → 마음일기 모아보기
         파일(뒷판·앞판·발바닥·터지는 점) 색은 고른 감정 색(--emo)으로 바뀜 -->
    <div class="diary-done" id="done" role="dialog" aria-modal="true" aria-labelledby="done-title" hidden data-node-id="2011:20057">
      <h2 class="diary-done__title" id="done-title" data-node-id="2012:12859">오늘의 마음일기가<br />저장되었어요</h2>
      <div class="diary-done__folder" data-node-id="2011:20280" aria-hidden="true">
        <span class="diary-done__back" data-node-id="2011:20278"></span>
        <img class="diary-done__papers" src="assets/diary/done-papers.svg" width="270.327" height="270.288" alt="" data-node-id="2011:20244" />
        <img class="diary-done__front emo-tint" src="assets/diary/done-folder-front.svg" width="242.456" height="126.633" alt="" data-node-id="2011:20264" />
        <span class="diary-done__paw" data-node-id="2011:20285">
          <span class="done-paw">
            <img class="done-paw__pad emo-tint" src="assets/diary/done-paw-pad.svg" width="40.584" height="31.5782" alt="" />
            <span class="done-paw__toe done-paw__toe--l"><img class="emo-tint" src="assets/diary/done-paw-toe-l.svg" width="16.107" height="18.9162" alt="" /></span>
            <img class="done-paw__toe-ml emo-tint" src="assets/diary/done-paw-toe-ml.svg" width="18.0023" height="22.4438" alt="" />
            <img class="done-paw__toe-mr emo-tint" src="assets/diary/done-paw-toe-mr.svg" width="18.0023" height="22.4438" alt="" />
            <span class="done-paw__toe done-paw__toe--r"><img class="emo-tint" src="assets/diary/done-paw-toe-r.svg" width="16.107" height="18.9162" alt="" /></span>
          </span>
        </span>
        <!-- 발바닥 주변으로 작게 터지는 점 -->
        <span class="diary-done__burst"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
      <a class="diary-done__ok" id="done-ok" href="diary.html" aria-label="마음일기 모아보기로 이동" data-node-id="2011:20463">
        <img src="assets/diary/done-check.svg" width="64.3636" height="64.3636" alt="" />
      </a>
    </div>
  </main>

  <!-- 감정 발바닥 아이콘 (40 × 40, 색상은 currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="paw-lg" viewBox="0 0 40 40">
      <path d="M20.0068 18.5815C22.4708 18.4793 27.5134 20.6993 28.001 27.5679C28.0817 28.7052 27.2527 30.2555 25.9043 30.7612C22.9422 31.5897 22.1391 30.2194 20.0068 30.2192C17.8744 30.2192 17.0713 31.5895 14.1094 30.7612C12.7608 30.2556 11.932 28.7052 12.0127 27.5679C12.5003 20.699 17.543 18.4791 20.0068 18.5815Z" />
      <ellipse cx="3.17489" cy="3.72863" rx="3.17489" ry="3.72863" transform="matrix(0.958807 -0.284059 0.315102 0.949058 5.11768 16.9282)" />
      <ellipse cx="15.5553" cy="13.3966" rx="3.54849" ry="4.42394" />
      <ellipse cx="24.4442" cy="13.3966" rx="3.54849" ry="4.42394" />
      <ellipse cx="3.17489" cy="3.72863" rx="3.17489" ry="3.72863" transform="matrix(-0.958807 -0.284059 -0.315102 0.949058 34.8818 16.9282)" />
    </symbol>
  </svg>

  <script src="diary-store.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var params = new URLSearchParams(location.search);
      // ?id= 가 있으면 기존 일기 수정 모드
      var editing = params.get('id') ? DiaryStore.get(params.get('id')) : null;
      var selected = editing ? editing.emo
        : (DiaryStore.emotion(params.get('emo')) ? params.get('emo') : null);   // 새 일기는 감정 미선택으로 시작
      if (editing) {
        $('diary-text').value = editing.text;
        document.title = '패니 · 마음일기 수정하기';
      }

      // 감정 선택 라디오
      var listEl = $('emo-list');
      DiaryStore.EMOTIONS.forEach(function (e) {
        var label = document.createElement('label');
        label.className = 'emo-option';
        label.style.setProperty('--emo', e.color);
        label.innerHTML =
          '<input class="visually-hidden" type="radio" name="emo" value="' + e.key + '" />' +
          '<span class="emo-option__icon"><svg viewBox="0 0 40 40" aria-hidden="true"><use href="#paw-lg" /></svg></span>' +
          '<span class="emo-option__label">' + e.label + '</span>';
        var input = label.querySelector('input');
        input.checked = e.key === selected;
        input.addEventListener('change', function () { select(e.key); });
        listEl.appendChild(label);
      });

      function select(key) {
        selected = key;
        $('note').style.setProperty('--emo', DiaryStore.emotion(key).color);
      }
      if (selected) select(selected);

      // 작성 날짜(요일) · 시간 자동 표시 (분 단위로 갱신) — 수정 중이면 원래 작성 시각 고정
      function tick() {
        var now = editing ? editing.at : Date.now();
        $('note-date').textContent = DiaryStore.formatDate(now);
        $('note-date').dateTime = new Date(now).toISOString();
        $('note-time').textContent = DiaryStore.formatTime(now);
      }
      tick();
      if (!editing) setInterval(tick, 15000);

      // 이전 페이지가 있으면 뒤로 가기
      $('back').addEventListener('click', function (ev) {
        if (document.referrer && history.length > 1) { ev.preventDefault(); history.back(); }
      });
      // X: 작성 취소 → 마음일기 모아보기 (수정 중이면 그 감정의 일기 목록)
      if (editing) $('cancel').href = 'diary-list.html?emo=' + editing.emo;
      $('cancel').addEventListener('click', function (ev) {
        ev.preventDefault();
        location.replace($('cancel').href);
      });

      var toastTimer;
      function toast(msg) {
        var t = $('toast');
        t.textContent = msg;
        t.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.hidden = true; }, 2000);
      }

      $('diary-form').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var text = $('diary-text').value.trim();
        if (!text) { toast('마음 일기를 입력해 주세요.'); $('diary-text').focus(); return; }
        if (!selected) { toast('감정 상태를 선택해 주세요.'); listEl.querySelector('input').focus(); return; }
        var saved = editing ? DiaryStore.update(editing.id, selected, text) : DiaryStore.add(selected, text);
        if (!saved) { toast('일기를 저장하지 못했어요.'); return; }
        // 수정: 바뀐 감정 상태의 일기 페이지로 이동
        if (editing) { location.replace('diary-list.html?emo=' + selected); return; }
        // 새 일기: 저장 완료 화면 → 체크 누르면 마음일기 모아보기
        showDone();
      });

      function showDone() {
        // 저장 완료 파일을 고른 감정 색으로
        $('done').style.setProperty('--emo', DiaryStore.emotion(selected).color);
        $('diary-form').inert = true;
        document.querySelector('.appbar').inert = true;
        $('done').hidden = false;
        $('done-ok').focus({ preventScroll: true });
      }
      $('done-ok').addEventListener('click', function (ev) {
        ev.preventDefault();
        location.replace('diary.html');   // 뒤로 가기로 작성 화면에 돌아오지 않도록
      });
    })();
  </script>
  <script src="back-origin.js"></script>
</body>
</html>
