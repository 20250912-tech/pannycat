<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 온보딩</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding" data-node-id="1:2494">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <h1 class="onboarding__title">
      불안한 순간에도,<br />
      패니와 함께 잠시 쉬어가요.
    </h1>

    <div class="panny" role="img" aria-label="눈을 감고 쉬고 있는 검은 고양이 패니">
      <img class="panny__body" src="assets/panny-body.svg" width="134.71" height="93.4791" alt="" />
      <img class="panny__head" src="assets/panny-head.svg" width="246.07" height="189.043" alt="" />
    </div>

    <div class="spacer"></div>

    <div class="bubble">
      <img class="bubble__bg" src="assets/bubble.svg" width="282" height="85.0388" alt="" />
      <p class="bubble__text">
        딱 맞는 도움을 준비할 수 있도록<br />
        패니에게 당신의 이야기를 들려주세요.
      </p>
    </div>

    <a class="btn-primary" href="onboarding-nickname.html">시작하기</a>
  </main>
</body>
</html>
