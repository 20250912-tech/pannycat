<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 도움 선택</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding onboarding--step" data-node-id="1:2445" data-question="help">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <div class="progress" role="progressbar" aria-label="온보딩 진행도" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1">
      <span class="progress__fill" style="--progress: 1 / 6"></span>
    </div>

    <h1 class="step__title">패니에게 어떤 도움을 받고 싶나요?</h1>
    <p class="step__subtitle" id="help-hint">원하는 도움을 모두 골라주세요</p>

    <div class="spacer spacer--before-chips"></div>

    <div class="chips" role="group" aria-labelledby="help-hint">
      <button type="button" class="chip" aria-pressed="false" data-value="calm">빠른 진정</button>
      <button type="button" class="chip" aria-pressed="false" data-value="daily-care">평소 스트레스·마음 관리</button>
      <button type="button" class="chip" aria-pressed="false" data-value="mood-log">마음상태 기록</button>
      <button type="button" class="chip" aria-pressed="false" data-value="emergency">위급상황 대처</button>
    </div>

    <div class="spacer spacer--after-chips"></div>

    <a class="skip-link" href="onboarding-ready.html">건너뛰기</a>

    <div class="btn-row">
      <a class="btn-secondary" href="onboarding-nickname.html">이전으로</a>
      <a class="btn-primary" href="onboarding-trigger.html">다음으로</a>
    </div>
  </main>

  <script>
    document.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        var on = chip.getAttribute('aria-pressed') === 'true';
        chip.setAttribute('aria-pressed', String(!on));
      });
    });
  </script>
  <script src="answers.js"></script>
  <script src="onboarding-answers.js"></script>
</body>
</html>
