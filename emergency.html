<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 긴급 연락 설정</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Figma 1:5005 "긴급 연락처 방식" — 보호자 연락처의 .onboarding.breath 프레임·.appbar·.profile-field__label·.btn-primary 재사용 -->
  <main class="onboarding breath profile-edit emergency" data-node-id="1:5005">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <header class="appbar" data-node-id="1:5021">
      <a class="appbar__back" href="mypage.html" aria-label="뒤로 가기">
        <img src="assets/profile/back.svg" width="24" height="24" alt="" />
      </a>
      <h1 class="appbar__title profile-edit__title">긴급 연락 설정</h1>
      <span class="appbar__side" aria-hidden="true"></span>
    </header>

    <form class="profile-edit__form emergency__form" id="emergency-form" novalidate>
      <!-- 연락 방식 (top 140) -->
      <h2 class="profile-field__label guardian__label" id="em-method" data-node-id="1:5017">연락 방식</h2>
      <div class="emergency-methods" role="radiogroup" aria-labelledby="em-method">
        <button class="emergency-option" type="button" role="radio" aria-checked="false" data-method="call" data-node-id="37:8617">
          <span class="emergency-option__text">
            <strong class="emergency-option__name">전화 연결</strong>
            <span class="emergency-option__desc">등록된 번호로 전화 연결하기</span>
          </span>
          <img class="emergency-option__on" src="assets/emergency/radio-on.svg" width="19" height="19" alt="" />
          <img class="emergency-option__off" src="assets/emergency/radio-off.svg" width="19" height="19" alt="" />
        </button>
        <button class="emergency-option" type="button" role="radio" aria-checked="true" data-method="message" data-node-id="37:8625">
          <span class="emergency-option__text">
            <strong class="emergency-option__name">메세지 전송</strong>
            <span class="emergency-option__desc">미리 작성한 긴급 메세지 전달하기</span>
          </span>
          <img class="emergency-option__on" src="assets/emergency/radio-on.svg" width="19" height="19" alt="" />
          <img class="emergency-option__off" src="assets/emergency/radio-off.svg" width="19" height="19" alt="" />
        </button>
      </div>

      <!-- 메세지 설정 (top 372) -->
      <h2 class="profile-field__label emergency__label" data-node-id="1:5018">메세지 설정</h2>
      <div class="emergency-message" data-node-id="1:5008">
        <label class="emergency-message__title" for="em-message" data-node-id="1:5011">메세지 작성하기</label>
        <textarea class="emergency-message__input" id="em-message" name="message" rows="1" maxlength="200"
                  placeholder="보호자에게 보낼 메세지를 적어주세요." aria-describedby="em-message-count" data-node-id="1:5026"></textarea>
        <p class="emergency-message__count" id="em-message-count" aria-live="polite"><span id="em-count">0</span>/200</p>
      </div>

      <button class="btn-primary profile-edit__save" id="save-btn" type="submit" data-node-id="1:5028">저장하기</button>
    </form>
  </main>

  <script src="emergency.js"></script>
</body>
</html>
