<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 지금 불안 정도</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="onboarding onboarding--step onboarding--anxiety" data-node-id="1:2417">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <div class="progress" role="progressbar" aria-label="온보딩 진행도" aria-valuemin="1" aria-valuemax="6" aria-valuenow="4">
      <span class="progress__fill" style="--progress: 4 / 6"></span>
    </div>

    <h1 class="step__title">지금 불안은 어느정도인가요?</h1>
    <p class="step__subtitle">지금 느끼는 정도를 표시해주세요.</p>

    <div class="spacer spacer--before-chips"></div>

    <p class="anxiety__label" id="anxiety-label" aria-live="polite">매우 불안해요</p>

    <!-- Figma 8:5365 "고양이 변화" — data-level 1~5에 맞는 패니만 표시 -->
    <div class="anxiety__panny" id="anxiety-panny" data-level="1" role="img" aria-label="식은땀을 흘리며 불안해하는 검은 고양이 패니">
      <img class="anxiety__cat" data-for="1" src="assets/panny-level1.svg" width="224.055" height="172.13" alt="" />
      <img class="anxiety__cat" data-for="2" src="assets/panny-level2.svg" width="224.055" height="172.13" alt="" />
      <img class="anxiety__cat" data-for="3" src="assets/panny-level3.svg" width="224.055" height="172.13" alt="" />
      <img class="anxiety__cat anxiety__cat-face" data-for="3" src="assets/panny-level3-face.svg" width="138.016" height="24.2741" alt="" />
      <img class="anxiety__cat" data-for="4" src="assets/panny-level4.svg" width="224.055" height="172.13" alt="" />
      <img class="anxiety__cat anxiety__cat--wide" data-for="5" src="assets/panny-level5.svg" width="225.961" height="172.13" alt="" />
    </div>

    <section class="level-card" aria-labelledby="level-title">
      <div class="level-card__head">
        <h2 class="level-card__title" id="level-title">불안 정도</h2>
        <p class="level-card__value"><span id="level-value">1</span><span class="level-card__max"> / 5</span></p>
      </div>
      <div class="level-slider" id="level-slider" tabindex="0" role="slider"
           aria-labelledby="level-title" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="1, 매우 불안해요">
        <span class="level-slider__fill" aria-hidden="true"></span>
        <span class="level-slider__thumb"><img src="assets/slider-thumb.svg" width="38.2" height="38.2" alt="" /></span>
      </div>
      <div class="level-card__scale" aria-hidden="true">
        <span>1<br />매우 불안해요</span>
        <span>5<br />매우 편안해요</span>
      </div>
    </section>

    <div class="spacer spacer--after-chips"></div>

    <a class="skip-link" href="onboarding-ready.html">건너뛰기</a>

    <div class="btn-row">
      <a class="btn-secondary" href="onboarding-coping.html">이전으로</a>
      <a class="btn-primary" href="onboarding-feeling.html">다음으로</a>
    </div>
  </main>

  <script src="anxiety-slider.js"></script>
  <script>
    AnxietySlider.init({
      slider: document.getElementById('level-slider'),
      panny: document.getElementById('anxiety-panny'),
      valueEl: document.getElementById('level-value'),
      labelEl: document.getElementById('anxiety-label')
    });
  </script>
</body>
</html>
