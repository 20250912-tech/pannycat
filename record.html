<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-home">
  <!-- Figma 1:2041 "기록 캘린더_기록X" · 1:3406 "기록 캘린더_기록O"
       홈 레이아웃(.home / .home__scroll / .status-bar / .tabbar) 재사용 -->
  <div class="home record" data-node-id="1:3406">
    <main class="home__scroll record__scroll">
      <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
      <div class="status-bar" aria-hidden="true">
        <span class="status-bar__time">9:41</span>
        <span class="status-bar__levels">
          <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
          <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
          <img src="assets/battery.svg" width="27.328" height="13" alt="" />
        </span>
      </div>

      <!-- 캘린더 / 리포트 전환 -->
      <nav class="record-seg" aria-label="기록 보기 방식" data-node-id="1:3582">
        <a class="record-seg__item is-active" href="record.html" aria-current="page">캘린더</a>
        <a class="record-seg__item" href="record-report.html">리포트</a>
      </nav>

      <!-- 월간 캘린더 (353×426, radius 15, padding 22/26) -->
      <section class="record-cal" aria-labelledby="cal-title" data-node-id="1:3415">
        <div class="record-cal__head">
          <button class="record-cal__nav" type="button" id="cal-prev" aria-label="이전 달">‹</button>
          <h1 class="record-cal__title" id="cal-title" aria-live="polite"></h1>
          <button class="record-cal__nav" type="button" id="cal-next" aria-label="다음 달">›</button>
        </div>
        <div class="record-cal__dow" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="record-cal__grid" id="cal-grid" role="grid" aria-labelledby="cal-title"></div>
      </section>

      <!-- 선택한 날의 기록 -->
      <section class="record-day" aria-labelledby="day-title" data-node-id="1:3533">
        <div class="record-day__head">
          <span class="record-day__badge" id="day-badge"><strong id="day-num"></strong><span id="day-dow"></span></span>
          <h2 class="record-day__title" id="day-title">오늘의 기록</h2>
          <a class="record-day__more" id="day-more" href="record-detail.html">자세히 ›</a>
        </div>
        <div class="record-day__cards" id="day-cards"></div>
      </section>
    </main>

    <!-- 하단 네비게이션 -->
    <nav class="tabbar" aria-label="주요 메뉴" data-node-id="8:5611">
      <a class="tabbar__item" href="home.html">
        <img src="assets/activity/nav-home-off.svg" width="22.249" height="23.7322" alt="" />
        <span>홈</span>
      </a>
      <a class="tabbar__item" href="activity.html">
        <img src="assets/home/nav-activity-off.svg" width="25.2055" height="25.2055" alt="" />
        <span>활동하기</span>
      </a>
      <a class="tabbar__item" href="counsel.html">
        <img src="assets/home/nav-counsel-off.svg" width="25.2489" height="22.937" alt="" />
        <span>상담</span>
      </a>
      <a class="tabbar__item tabbar__item--record is-active" href="record.html" aria-current="page">
        <img src="assets/record/nav-record-on.svg" width="25.2055" height="25.2055" alt="" />
        <span>기록</span>
      </a>
      <a class="tabbar__item" href="mypage.html">
        <img src="assets/home/nav-my.svg" width="26.0121" height="23.6303" alt="" />
        <span>마이페이지</span>
      </a>
    </nav>
  </div>

  <script src="diary-store.js"></script>
  <script src="record-store.js"></script>
  <script src="back-origin.js"></script>
  <script src="record.js"></script>
</body>
</html>
