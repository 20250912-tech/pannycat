<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>패니 · 긴급 호출</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-sos">
  <!-- Figma 1:1776 "긴급화면" — 10초 후 자동으로 긴급화면_호흡(1:1794)으로 이동 -->
  <main class="sos" data-node-id="1:1776">
    <!-- 데스크톱 미리보기용 상태바 (실제 모바일 기기에서는 숨김) -->
    <div class="status-bar status-bar--light" aria-hidden="true">
      <span class="status-bar__time">9:41</span>
      <span class="status-bar__levels">
        <img src="assets/cellular.svg" width="19.2" height="12.2264" alt="" />
        <img src="assets/wifi.svg" width="17.1417" height="12.3283" alt="" />
        <img src="assets/battery.svg" width="27.328" height="13" alt="" />
      </span>
    </div>

    <p class="sos__label" data-node-id="1:1785">긴급 호출 실행</p>
    <h1 class="sos__title" data-node-id="1:1784" aria-live="polite">
      <span id="sos-count">10</span>초 후 긴급 연락 및<br />호흡활동이 진행됩니다.
    </h1>

    <div class="sos__siren" aria-hidden="true" data-node-id="1:1778">
      <img src="assets/sos/siren-circle.svg" width="345" height="345" alt="" />
    </div>

    <div class="sos__actions">
      <a class="sos__now" id="sos-now" href="sos-breathing.html" data-node-id="1:1787">즉시 실행</a>

      <!-- 밀어서 중단: 손잡이를 오른쪽 끝까지 밀면 홈으로 -->
      <div class="sos-slide" id="sos-slide" data-node-id="1:1786">
        <span class="sos-slide__text" data-node-id="1:1792">밀어서 중단</span>
        <button class="sos-slide__knob" id="sos-knob" type="button"
                role="slider" aria-label="밀어서 중단" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                aria-valuetext="오른쪽 끝까지 밀면 중단돼요" data-node-id="1:1788">
          <span class="sos-slide__stop"></span>
        </button>
      </div>
    </div>
  </main>

  <script src="sos.js"></script>
</body>
</html>
